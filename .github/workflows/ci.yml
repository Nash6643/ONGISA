name: ONGISA CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    name: Python Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov
          pip install -e packages/forge-core || true
          pip install -e packages/forge-analyzer || true
          pip install -e packages/forge-ai || true
          pip install -e packages/forge-refactor || true
          pip install -e CLI/forge-cli || true

      - name: Run Pytest
        env:
          PYTHONPATH: "packages/forge-refactor/src:packages/forge-analyzer/src:packages/forge-core/src:packages/forge-ai/src"
        run: |
          pytest --ignore=node_modules --ignore=apps/forge-web || true

  nextjs-build:
    name: Next.js Web Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        env:
          GEMINI_API_KEY: "dummy_key_for_ci_build"
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build --workspace=apps/forge-web