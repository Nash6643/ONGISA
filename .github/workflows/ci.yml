name: ONGISA CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Packages & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi uvicorn python-multipart tree-sitter google-generativeai astor
          pip install -e ./packages/forge-core
          pip install -e ./packages/forge-analyzer
          pip install -e ./packages/forge-ai

      - name: Run Pytest Suite
        env:
          PYTHONPATH: "${{ github.workspace }}/packages/forge-core/src:${{ github.workspace }}/packages/forge-analyzer/src:${{ github.workspace }}/packages/forge-ai/src"
        run: |
          python -m pytest packages/forge-analyzer/tests packages/forge-ai/tests

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/forge-web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix apps/forge-web

      - name: Build Next.js Web App
        run: npm run build --prefix apps/forge-web