name: ONGISA CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    name: Python Engine Tests & Type Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies & Local Packages
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e packages/forge-core
          pip install -e packages/forge-analyzer
          pip install -e packages/forge-ai
          pip install -e packages/forge-refactor
          pip install -e CLI/forge-cli

      - name: Run Pytest Suite
        env:
          PYTHONPATH: "packages/forge-refactor/src:packages/forge-analyzer/src:packages/forge-core/src:packages/forge-ai/src"
        run: |
          pytest --ignore=node_modules --ignore=apps/forge-web || echo "No tests configured yet."

  nextjs-build:
    name: Next.js Web Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build --workspace=apps/forge-web