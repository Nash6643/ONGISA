version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  web:
    build:
      context: ./apps/forge-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - FORGE_AI_URL=http://api:8000
    depends_on:
      - api