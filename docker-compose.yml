version: '3.8'

services:
  forge-api:
    build:
      context: ./packages/forge-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  forge-web:
    build:
      context: ./apps/forge-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - forge-api
    restart: always