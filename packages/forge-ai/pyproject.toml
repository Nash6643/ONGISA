[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ai"
version = "0.1.0"
dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "forge-core"
]

[tool.setuptools.packages.find]
where = ["src"]